name: Build NovaClient

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          cache-disabled: true

      - name: Find and validate project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.git/*' -not -path '*/build/*' -not -path '*/.gradle/*' \
            -print -quit)"
          if [[ -z "$BUILD_FILE" ]]; then
            echo '::error::build.gradle bulunamadı.'
            find . -maxdepth 5 -type f -not -path './.git/*' | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proje klasörü: $PROJECT_DIR"

      - name: Validate Gradle tasks
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon tasks

      - name: Build JAR
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon clean build

      - name: Verify JAR
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print
          if ! find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | grep -q .; then
            echo '::error::JAR oluşmadı.'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NovaClient-JAR
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
